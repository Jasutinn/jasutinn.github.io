<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; }
        h1 { text-align: center; }
        p { font-size: 18px; }
        .back-link { display: block; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <h1 id="entryTitle">Loading...</h1>
    <p id="entryContent"></p>
    <a href="index.html" class="back-link">⬅ Back to Journal</a>

    <script>
        fetch("entries.json")
            .then(response => response.json())
            .then(entries => {
                let urlParams = new URLSearchParams(window.location.search);
                let entryFile = urlParams.get("entry");

                let entry = entries.find(e => e.file === entryFile);

                if (entry) {
                    document.title = entry.title;
                    document.getElementById("entryTitle").innerText = entry.title;
                    
                    fetch(entry.file)
                        .then(response => response.text())
                        .then(content => {
                            document.getElementById("entryContent").innerHTML = content;
                        })
                        .catch(() => {
                            document.getElementById("entryContent").innerText = "Error loading content.";
                        });

                } else {
                    document.body.innerHTML = "<h1>Entry not found</h1><a href='index.html' class='back-link'>⬅ Back to Journal</a>";
                }
            })
            .catch(() => {
                document.body.innerHTML = "<h1>Error loading journal</h1><a href='index.html' class='back-link'>⬅ Back to Journal</a>";
            });
    </script>
</body>
</html>
