name: Professional Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libgomp1 \
            libffi-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev

      - name: Install Python Packages
        run: |
          pip install --upgrade setuptools>=65.5.1
          pip install \
            markdown==3.5.2 \
            pdfplumber==0.11.0 \
            python-docx==1.1.2 \
            PyMuPDF==1.24.4
          pip install pip-audit
          pip-audit

      - name: Generate Content
        run: |
          # Clean and initialize directories
          rm -rf public
          mkdir -p \
            journal/personal \
            journal/political \
            journal/legal \
            legislative

          # Create sample content for ALL sections
          echo "# Personal Reflection" > journal/personal/sample.md
          echo "## Private thoughts\n- Morning routine\n- Policy ideas" >> journal/personal/sample.md

          echo "# Political Analysis" > journal/political/sample.md
          echo "## Current Affairs\n1. Budget review\n2. Diplomatic meetings" >> journal/political/sample.md

          echo "# Legal Case Study" > journal/legal/sample.md
          echo "## Court Proceedings\n- Case #2024-01\n- Precedent analysis" >> journal/legal/sample.md

          echo "# Legislative Proposal" > legislative/sample.md
          echo "## New Bill\n- Tax reform\n- Education funding" >> legislative/sample.md

          # Generate HTML content
          python generate_entries.py

          # Validate design application in ALL sections
          check_files=(
            "/index.html"
            "/journal/index.html"
            "/journal/personal/index.html"
            "/journal/political/index.html"
            "/journal/legal/index.html"
            "/legislative/index.html"
            "/journal/personal/sample.html"
            "/journal/political/sample.html"
            "/journal/legal/sample.html" 
            "/legislative/sample.html"
          )

          for file in "${check_files[@]}"; do
            if [ ! -s "public${file}" ]; then
              echo "❌ Missing design in: ${file}"
              exit 1
            fi
          done

          echo "✅ Verified design consistency across:"
          printf " - %s\n" "${check_files[@]}"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          keep_files: false