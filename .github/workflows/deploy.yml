name: Deploy to GitHub Pages

on:
  push:
    branches:
      - default  # Ensure this is the actual name of your main branch
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          pip install markdown pdfplumber beautifulsoup4 python-docx

      - name: Run Python Script to Generate Entries
        run: python generate_entries.py

      - name: Create Public Folder (if missing)
        run: mkdir -p public

      - name: Move Journal Entries to Public
        run: |
          mkdir -p public/journal
          cp -r journal/* public/journal/ || echo "No journal files to move"

      - name: Debug: List Public Directory
        run: ls -R public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public