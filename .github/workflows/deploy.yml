- name: Set up Python
  uses: actions/setup-python@v4
  with:
    python-version: '3.x'

- name: Convert journal entries to HTML
  run: python scripts/convert_journal.py

- name: Commit converted HTML files
  run: |
    git config --global user.name "github-actions"
    git config --global user.email "github-actions@github.com"
    git add journal/*.html
    git commit -m "Convert journal entries to HTML"
    git push