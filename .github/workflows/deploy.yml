name: Professional Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libgomp1 \
            libffi-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev

      - name: Install Python Packages
        run: |
          pip install --upgrade setuptools>=65.5.1
          pip install \
            markdown==3.5.2 \
            pdfplumber==0.11.0 \
            python-docx==1.1.2 \
            PyMuPDF==1.24.4
          pip install pip-audit
          pip-audit

      - name: Generate Content
        run: |
          rm -rf public
          mkdir -p journal/{personal,political,legal} legislative
          
          # Create responsive test content
          if [ ! -f journal/political/responsive-test.md ]; then
            echo "# Responsive Design Test" > journal/political/responsive-test.md
            echo "This entry tests mobile-first layouts!" >> journal/political/responsive-test.md
          fi
          if [ ! -f legislative/responsive-bill.md ]; then
            echo "# Responsive Legislation" > legislative/responsive-bill.md
            echo "Test document for cross-device compatibility" >> legislative/responsive-bill.md
          fi

          python generate_entries.py
          
          # Validate responsive output
          [ -s public/index.html ] || (echo "Missing index.html" && exit 1)
          [ -s public/journal/political/responsive-test.html ] || (echo "Responsive content failed" && exit 1)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          keep_files: false