name: Deploy to GitHub Pages

on:
  push:
    branches:
      - default  # Replace with your actual default branch name
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          pip install markdown pdfplumber

      - name: Run Python Script
        run: python generate_entries.py

      - name: Create Public Folder (if missing)
        run: mkdir -p public

      - name: Move Journal Entries to Public
        run: cp -r journal/* public/

      - name: Commit and Push Changes to gh-pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git commit -m "Deploy site updates" || echo "No changes to commit"
          git push origin gh-pages --force

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public