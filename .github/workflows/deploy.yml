name: Deploy to GitHub Pages

on:
  push:
    branches:
      - default  # Ensure this matches your default branch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install markdown pdfplumber beautifulsoup4 python-docx

      - name: Run Python Script
        run: python generate_entries.py  # Ensure this script exists and works properly

      - name: Create Public Directory
        run: mkdir -p public

      - name: Create Styled Index Page
        run: |
          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Political Journal</title>
              <style>
                  body {
                      font-family: "Times New Roman", serif;
                      margin: 40px;
                      background-color: #f5f5f5;
                      color: #333;
                      text-align: justify;
                  }
                  header {
                      background-color: #00274D;
                      color: white;
                      padding: 20px;
                      text-align: center;
                      font-size: 24px;
                      font-weight: bold;
                  }
                  article {
                      background: white;
                      padding: 20px;
                      margin: 20px auto;
                      border-radius: 5px;
                      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                      max-width: 800px;
                  }
                  footer {
                      text-align: center;
                      padding: 10px;
                      margin-top: 20px;
                      background-color: #00274D;
                      color: white;
                  }
                  a {
                      color: #00274D;
                      text-decoration: none;
                      font-weight: bold;
                  }
              </style>
          </head>
          <body>
              <header>Political Journal</header>
              <article>
                  <h2>Welcome to My Political Journal</h2>
                  <p>This is a collection of my political thoughts, legal insights, and journal entries related to governance, law, and human rights.</p>
                  <p>Browse the latest entries below:</p>
                  <ul>
                      $(ls public/journal/*.html | sed 's|public/journal/|<li><a href="journal/|g' | sed 's|.html|.html">Journal Entry</a></li>|g')
                  </ul>
              </article>
              <footer>&copy; 2025 Justine de La Torre | All Rights Reserved</footer>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public  # Make sure this is correct