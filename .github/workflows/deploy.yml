name: Professional Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libgomp1 \
            libffi-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev

      - name: Install Python Packages
        run: |
          pip install --upgrade setuptools>=65.5.1
          pip install \
            markdown==3.5.2 \
            pdfplumber==0.11.0 \
            python-docx==1.1.2 \
            PyMuPDF==1.24.4
          pip install pip-audit
          pip-audit

      - name: Generate Content
        run: |
          # Clean and create directories
          rm -rf public
          mkdir -p journal/{personal,political,legal} legislative
          
          # Create mandatory test files (if missing)
          if [ ! -f journal/political/test.md ]; then
            echo "# Test Political Entry" > journal/political/test.md
            echo "This tests responsive layouts" >> journal/political/test.md
          fi
          if [ ! -f legislative/bill.md ]; then
            echo "# Test Legislation" > legislative/bill.md
            echo "Sample bill content" >> legislative/bill.md
          fi

          # Generate HTML
          python generate_entries.py
          
          # Validate critical files exist
          if [ ! -s public/index.html ]; then
            echo "❌ Main index.html missing or empty"
            exit 1
          fi
          if [ ! -s public/journal/political/test.html ]; then
            echo "❌ Journal content not generated"
            exit 1
          fi
          if [ ! -s public/legislative/bill.html ]; then
            echo "❌ Legislative content not generated"
            exit 1
          fi
          echo "✅ All content generated successfully"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          keep_files: false