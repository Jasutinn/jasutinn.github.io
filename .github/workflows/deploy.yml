name: Guaranteed Publication

on:
  push:
    branches: [default]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Critical Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0
          sudo ln -s /usr/lib/x86_64-linux-gnu/libz.so /usr/lib/

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            markdown \
            pdfplumber \
            python-docx \
            beautifulsoup4 \
            pygments

      - name: Generate Content with Verification
        run: |
          rm -rf public
          python generate_entries.py
          
          # Validate output
          [ -f public/index.html ] || exit 1
          [ -d public/journal ] || exit 1
          echo "Generated files:"
          ls -lR public
          echo "Total entries: $(ls public/journal | wc -l)"

      - name: Force Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
          keep_files: false