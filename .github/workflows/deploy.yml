name: Professional Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libgomp1 \
            libffi-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev

      - name: Install Python Packages
        run: |
          pip install markdown==3.5.2 pdfplumber==0.11.0 python-docx==1.1.2 PyMuPDF==1.24.4
          pip-audit

      - name: Generate Content
        run: |
          rm -rf public
          mkdir -p journal
          [ "$(ls -A journal)" ] || touch journal/placeholder.md
          python generate_entries.py || exit 1
          [ -s public/index.html ] || (echo "Invalid index file" && exit 1)
          ls -lR public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          keep_files: false