name: Guaranteed Deployment

on:
  push:
    branches: [default]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Critical Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgomp1
          pip install markdown pdfplumber python-docx beautifulsoup4

      - name: Clean & Generate
        run: |
          rm -rf public
          python generate_entries.py
          ls -R public  # Verify file structure

      - name: Nuclear Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          keep_files: false