name: Professional Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libgomp1 \
            libffi-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev

      - name: Install Python Packages
        run: |
          pip install --upgrade setuptools>=65.5.1
          pip install \
            markdown==3.5.2 \
            pdfplumber==0.11.0 \
            python-docx==1.1.2 \
            PyMuPDF==1.24.4
          pip install pip-audit
          pip-audit

      - name: Generate Content
        run: |
          # Clean workspace
          rm -rf public
          mkdir -p public

          # Create mandatory sample content
          mkdir -p journal/{personal,political,legal} legislative
          echo "# Sample Entry" > journal/personal/sample.md
          echo "# Sample Analysis" > journal/political/sample.md
          echo "# Legal Case" > journal/legal/sample.md
          echo "# Proposed Bill" > legislative/sample.md

          # Generate HTML files
          python generate_entries.py

          # Validate all critical files
          check_files=(
            "/index.html"
            "/journal/index.html"
            "/journal/personal/index.html"
            "/journal/political/index.html" 
            "/journal/legal/index.html"
            "/legislative/index.html"
            "/journal/personal/sample.html"
            "/journal/political/sample.html"
            "/journal/legal/sample.html"
            "/legislative/sample.html"
          )

          for file in "${check_files[@]}"; do
            if [ ! -s "public${file}" ]; then
              echo "❌ Missing file: public${file}"
              exit 1
            fi
          done

          echo "✅ Verified all files:"
          tree public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          keep_files: false