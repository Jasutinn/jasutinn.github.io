name: Professional Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Increased timeout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libgomp1 \
            libffi-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev

      - name: Install Python Packages
        run: |
          pip install -r requirements.txt

      - name: Generate Content
        run: |
          rm -rf public
          # Ensure journal directory exists
          mkdir -p journal
          # Create placeholder if empty
          [ "$(ls -A journal)" ] || touch journal/placeholder.md
          # Run generator with logging
          python generate_entries.py || exit 1
          # Verify output integrity
          [ -s public/index.html ] || (echo "Index file invalid" && exit 1)
          ls -lR public  # Debug output

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          keep_files: false