name: Update Journal Entries
on:
  push:
    branches:
      - gh-pages  # Run when changes happen in the journal folder
    paths:
      - 'journal/*.md'  # Trigger only when a Markdown file is changed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install markdown

      - name: Run Script to Generate Entries
        run: python generate_entries.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add journal/*.html journal/entries.json
          git commit -m "Auto-update journal entries" || echo "No changes to commit"
          git push